name: Update Playabl Cron Every 2 Hours

on:
  schedule:
    - cron: '0 */2 * * *'  # هذا السطر هو الذي يجعله يعمل تلقائياً كل ساعتين
  workflow_dispatch:        # وهذا لزر التشغيل اليدوي متى ما أردت

jobs:
  run-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run script
        env:
          PLAYABL_EMAIL: ${{ secrets.PLAYABL_EMAIL }}
          PLAYABL_PASSWORD: ${{ secrets.PLAYABL_PASSWORD }}
        run: |
          python update_playabl.py
