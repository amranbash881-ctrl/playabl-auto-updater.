name: Playabl Automation

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run automation script
        env:
          PLAYABL_EMAIL_1: ${{ secrets.PLAYABL_EMAIL}}
          PLAYABL_PASSWORD_1: ${{ secrets.PLAYABL_PASSWORD}}
      
        run: |
          python four_accounts.py
