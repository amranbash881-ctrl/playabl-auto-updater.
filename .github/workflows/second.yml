name: run Playabl Automation

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run automation script
        env:
          PLAYABL_EMAIL: ${{ secrets.PLAYABL_EMAIL }}
          PLAYABL_PASSWORD: ${{ secrets.PLAYABL_PASSWORD }}
        run: |
          python ubdate_playabl.py
