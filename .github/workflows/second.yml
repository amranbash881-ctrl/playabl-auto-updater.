name: Run Playabl Automation

on:
  repository_dispatch:
    types: [run_cron_task]
  workflow_dispatch: # يتيح لك تشغيله يدوياً من قيت هب للتجربة

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run automation script
        env:
          PLAYABL_EMAIL: ${{ secrets.PLAYABL_EMAIL }}
          PLAYABL_PASSWORD: ${{ secrets.PLAYABL_PASSWORD }}
        run: |
          python update_playabl.py
